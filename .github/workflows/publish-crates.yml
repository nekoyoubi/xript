name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Publishes the crates in dependency order. Each crate is skipped when its
      # version is already on crates.io (so a re-run after a partial failure is
      # safe), otherwise published and waited on until the index catches up so the
      # next crate can resolve it. A real `cargo publish` failure fails the job:
      # a missing crate must not report success, which is how v0.8.0 shipped with
      # only xript-expr on crates.io.
      - name: publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          UA="xript-ci-publish (https://github.com/nekoyoubi/xript)"
          publish() {
            local name="$1" manifest="$2" ver
            ver=$(grep -m1 '^version = ' "$manifest" | sed 's/version = //; s/"//g')
            if curl -sf -H "User-Agent: $UA" "https://crates.io/api/v1/crates/$name/$ver" >/dev/null 2>&1; then
              echo "== $name $ver already on crates.io, skipping"
              return 0
            fi
            echo "== publishing $name $ver"
            cargo publish --allow-dirty --manifest-path "$manifest"
            echo "== waiting for $name $ver to index"
            for _ in $(seq 1 30); do
              if curl -sf -H "User-Agent: $UA" "https://crates.io/api/v1/crates/$name/$ver" >/dev/null 2>&1; then
                echo "   indexed"
                return 0
              fi
              sleep 10
            done
            echo "   timed out waiting for the index; a dependent crate may need a re-run"
          }
          publish xript-expr    crates/xript-expr/Cargo.toml
          publish xript-tree    crates/xript-tree/Cargo.toml
          publish xript-runtime runtimes/rust/Cargo.toml
          publish xript-ratatui renderers/ratatui/Cargo.toml
          publish xript-wiz     tools/wiz/Cargo.toml
