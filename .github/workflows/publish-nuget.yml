name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: build
        run: dotnet build runtimes/csharp/Xript.Runtime.sln --configuration Release

      - name: test
        run: dotnet test runtimes/csharp/Xript.Runtime.sln --configuration Release --no-build

      - name: pack
        run: dotnet pack runtimes/csharp/src/Xript.Runtime/Xript.Runtime.csproj --configuration Release --no-build

      - name: nuget login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: push
        run: dotnet nuget push runtimes/csharp/src/Xript.Runtime/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
