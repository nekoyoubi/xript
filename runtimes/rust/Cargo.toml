[package]
name = "xript-runtime"
version = "0.10.0"
edition = "2024"
description = "Rust runtime for xript. Sandboxed JavaScript execution via QuickJS."
license = "MIT"
repository = "https://github.com/nekoyoubi/xript"
readme = "README.md"
keywords = ["xript", "runtime", "sandbox", "scripting", "quickjs"]
categories = ["game-development", "wasm", "embedded"]

[dependencies]
xript-expr = { version = "0.10.0", path = "../../crates/xript-expr" }
xript-tree = { version = "0.10.0", path = "../../crates/xript-tree" }
j5ml = "0.2.0"
pollster = "0.4"
regex = "1"
rquickjs = { version = "0.10", features = ["parallel", "loader", "futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[features]
default = ["threads"]
# `XriptHandle` and `XriptPool`, which run runtimes on std threads, and the
# watcher thread an async-mode call uses to observe its deadline while parked.
# Turn off (`default-features = false`) for a target with no threads, such as
# an emscripten build without pthreads.
threads = []
# Generate QuickJS bindings with bindgen instead of using the ones rquickjs
# ships. Needed for targets rquickjs has no prebuilt bindings for, such as
# `wasm32-unknown-emscripten`; requires libclang. See the README.
bindgen = ["rquickjs/bindgen"]
# Keep object keys in authored order across the host boundary instead of
# sorting them, so `Object.keys`, `for..in`, `JSON.stringify` and hook/event
# payload spreading see the order the host wrote. Off by default.
preserve_order = ["serde_json/preserve_order", "xript-expr/preserve_order", "xript-tree/preserve_order"]

[[test]]
name = "async_handle"
required-features = ["threads"]

[[test]]
name = "handle_pending"
required-features = ["threads"]

[[test]]
name = "pool"
required-features = ["threads"]

[[test]]
name = "pool_guarantees"
required-features = ["threads"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
