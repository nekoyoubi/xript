[package]
name = "xript-expr"
version = "0.10.2"
edition = "2021"
description = "The xript Expression Grammar (XEG) — parser, evaluator, and text-node interpolation for xript fragments."
license = "MIT"
repository = "https://github.com/nekoyoubi/xript"
readme = "README.md"
keywords = ["xript", "expression", "parser", "fragment", "interpolation"]
categories = ["parser-implementations", "template-engine"]

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Keep object keys in authored order instead of sorting them.
preserve_order = ["serde_json/preserve_order"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
