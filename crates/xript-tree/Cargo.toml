[package]
name = "xript-tree"
version = "0.10.0"
edition = "2021"
description = "The xript tree contract (xript-tree/1) — the engine-free node, condition, diagnostic, and op shapes a fragment renderer consumes."
license = "MIT"
repository = "https://github.com/nekoyoubi/xript"
readme = "README.md"
keywords = ["xript", "fragment", "renderer", "tree", "contract"]
categories = ["gui", "rendering"]

[dependencies]
xript-expr = { version = "0.10.0", path = "../xript-expr" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Keep object keys in authored order instead of sorting them.
preserve_order = ["serde_json/preserve_order", "xript-expr/preserve_order"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
