[package]
name = "xript-ratatui"
version = "0.8.1"
edition = "2021"
description = "Fragment renderer for Ratatui terminal applications — renders xript UI fragments as terminal widgets."
license = "MIT"
repository = "https://github.com/nekoyoubi/xript"
readme = "README.md"
keywords = ["xript", "ratatui", "tui", "fragment", "renderer"]
categories = ["command-line-interface", "rendering"]

[dependencies]
xript-tree = { version = "0.8.0", path = "../../crates/xript-tree" }
ratatui = "0.29"
ansi-to-tui = "7"
serde_json = "1"

[dev-dependencies]
xript-runtime = { version = "0.8.1", path = "../../runtimes/rust" }
crossterm = "0.28"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
